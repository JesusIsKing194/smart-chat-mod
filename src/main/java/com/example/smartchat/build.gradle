plugins {
    id 'net.fabricmc.fabric-loom' version '1.15'
    id 'maven-publish'
}

version = '1.0.0'
group = 'com.example'

base {
    archivesName = 'smart-chat-mod'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:26.2"
    implementation "net.fabricmc:fabric-loader:0.18.4"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}
