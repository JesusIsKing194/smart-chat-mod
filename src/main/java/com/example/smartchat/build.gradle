plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
}

version = '1.0.0'
group = 'com.example'

base {
    archivesName = 'smart-chat-mod'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:26.2"
    modImplementation "net.fabricmc:fabric-loader:0.16.5"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}
