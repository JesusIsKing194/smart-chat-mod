name: Build Fabric Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create settings.gradle if missing
        run: |
          if [ ! -f settings.gradle ]; then
            echo "rootProject.name = 'smart-chat-mod'" > settings.gradle
          fi

      - name: Build with Gradle & Remap Jar
        run: |
          wget https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH=$PWD/gradle-8.5/bin:$PATH
          gradle build remapJar

      - name: Upload Artifact (.jar file)
        uses: actions/upload-artifact@v4
        with:
          name: smart-chat-mod-jar
          path: build/libs/*.jar
          if-no-files-found: ignore
