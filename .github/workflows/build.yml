name: Build Fabric Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Ensure Project Structure
        run: |
          if [ ! -f settings.gradle ]; then
            echo "rootProject.name = 'smart-chat-mod'" > settings.gradle
          fi

      - name: Generate Wrapper & Build Remap Jar
        run: |
          gradle wrapper --gradle-version 8.5
          ./gradlew build remapJar --stacktrace

      - name: Upload Artifact (.jar file)
        uses: actions/upload-artifact@v4
        with:
          name: smart-chat-mod-jar
          path: build/libs/*.jar
